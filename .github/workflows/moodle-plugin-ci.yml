# A copy of the MAH reusable workflow (moodle-an-hochschulen/moodle-workflows,
# .github/workflows/moodle-plugin-ci.yml at 756e15d), with these additions (UAIBLAINE.md):
# a dependency listed in plugin-dependencies that is not publicly readable is cloned with
# the PLUGIN_DEPENDENCIES_TOKEN secret (MAH clones every dependency anonymously and has no
# input to authenticate it, so a plugin depending on a private repository cannot use it);
# the Development Leftover Checker skips the code declared in thirdpartylibs.xml; and
# gherkinlint skips the features of the plugin dependencies; a `runner` input sends
# every job to a self-hosted runner label instead of ubuntu-24.04; a Jest step runs core's
# Jest over the plugin's js/esm/tests; and an ESM build check fails a committed js/esm that
# core 5.3's `grunt esm` would not rebuild identically.
#
# Everything else stays MAH's on purpose, so `mdl ci <repo> --matrix` keeps deriving the
# same legs and gates from a caller's ci.yml: the file name (mdl-ci selects jobs whose
# `uses` matches moodle-plugin-ci.yml), every input name and default, the matrix (read
# from MAH's matrix.json at run time, the same file `mdl ci --refresh-matrix` vendors)
# and MAH's composite actions (still referenced from MAH).
#
# The delta is the `secrets:` entry below, the two "Add plugin dependencies" steps, the
# Development Leftover Checker step, the Grunt, ESM build check and Jest steps, the
# `runner` input with the four `runs-on` lines, the Selenium image default and the
# setup-php inputs, kept as
# uaiblaine/mah-delta.patch.
# To follow MAH: fetch its file again, apply the patch, re-run actionlint, and update the
# commit named above.
name: Moodle Plugin CI

on:
  workflow_call:
    inputs:
      moodle-core-branch:
        description: Run the tests on this Moodle core branch (if not provided, the branch will be auto-detected from current branch)
        type: string
        required: false
      plugin-dependencies:
        description: List of plugin dependencies with repository and branch (use one dependency per line and separate repository and branch with a comma)
        type: string
        required: false
      one-db-only:
        description: Use only PostgreSQL database instead of all configured databases
        type: boolean
        required: false
        default: false
      max-parallel-verify:
        description: Maximum number of parallel jobs for the verify job (if not set, no limit applies)
        type: number
        required: false
      redis-enabled:
        description: Start Redis service before running runtime tests
        type: boolean
        required: false
        default: false
      php-extensions:
        description: Additional PHP extensions to install (comma-separated, e.g. "redis,memcached")
        type: string
        required: false
      docker-compose-file:
        description: Path to Docker Compose file (relative to plugin repository root) for starting an additional service
        type: string
        required: false
      pre-install-script:
        description: Custom script to run before installing moodle-plugin-ci (multiline bash script)
        type: string
        required: false
      extra-config:
        description: Additional lines to add to the Moodle config.php after installing moodle-plugin-ci (multiline, one PHP statement per line, e.g. "define('THEME_DESIGNER_CACHE_LIFETIME', 0);")
        type: string
        required: false
      behat-suite:
        description: The theme to be used for running Behat tests (e.g. "boost_union")
        type: string
        required: false
      behat-tags:
        description: Behat tags to filter which Behat scenarios to run (e.g. "@javascript"). Separate multiple tags with a comma, but without any spaces in-between.
        type: string
        required: false
      behat-timeout:
        description: Behat timeout multiplier (e.g. 3 for 3x timeout)
        type: number
        required: false
      behat-slices:
        description: Number of parallel Behat slices to split the Behat run across (1 = no splitting). Each slice runs a subset of the plugin's Behat feature files in its own job, distributed by scenario count.
        type: number
        required: false
        default: 1
      behat-strict:
        description: Let the runtime tests fail if Behat reports pending or undefined steps (which Behat itself does not treat as failures)
        type: boolean
        required: false
        default: true
      pr-check-diff-contains:
        description: Pull request diff must contain this text
        type: string
        required: false
      pr-check-diff-does-not-contain:
        description: Pull request diff must not contain this text
        type: string
        required: false
      pr-check-body-contains:
        description: Pull request body must contain this text
        type: string
        required: false
      pr-check-body-does-not-contain:
        description: Pull request body must not contain this text
        type: string
        required: false
      pr-check-files-changed:
        description: Number of files that must have changed in pull request
        type: string
        required: false
      pr-check-lines-changed:
        description: Number of lines that must have changed in pull request
        type: string
        required: false
      pr-check-waived-users:
        description: Comma-separated list of users exempt from pull request checks
        type: string
        required: false
      codebase-check-completeness:
        description: Which files the Plugin Codebase Completeness Checker requires, either "standard" (version.php, the English language file, the privacy provider and COPYING.txt), "extended" (the standard files plus the CHANGES.md, README.md and UPGRADE.md files which your organization may require on top) or "off" (no check at all)
        type: string
        required: false
        default: standard
      codebase-check-completeness-casesensitive:
        description: Let the Plugin Codebase Completeness Checker require the file names to match exactly (set to false to accept files which differ only in upper and lower case, e.g. Readme.md instead of README.md)
        type: boolean
        required: false
        default: true
      codebase-check-languagepacks:
        description: Let the Language Pack Checker print a warning if the plugin ships other language packs than the English one (set to false for unpublished plugins which legitimately ship their own translations)
        type: boolean
        required: false
        default: true
      phpcs-max-warnings:
        description: Number of warnings which are tolerated in the Moodle Code Checker (phpcs) step before it fails.
        type: number
        required: false
        default: 0
      phpdoc-max-warnings:
        description: Number of warnings which are tolerated in the Moodle PHPDoc Checker (phpdoc) step before it fails.
        type: number
        required: false
        default: 0
      grunt-max-lint-warnings:
        description: Number of lint warnings which are tolerated in the Grunt step before it fails.
        type: number
        required: false
        default: 0
      phpcs-continue-on-error:
        description: Continue on error for Moodle Code Checker (phpcs)
        type: boolean
        required: false
        default: false
      mustache-continue-on-error:
        description: Continue on error for Mustache Lint
        type: boolean
        required: false
        default: false
      scss-deprecations:
        description: Include SCSS deprecation warnings in Behat tests
        type: boolean
        required: false
        default: true
      runner:
        description: Runner label for every job (uaiblaine fork; empty means GitHub's ubuntu-24.04). A self-hosted arm64 runner gets the Chromium Selenium image, the only one with an arm64 manifest
        type: string
        required: false
        default: ''
    secrets:
      GENERIC_USERNAME_1:
        description: Generic secret to pass a username to the workflow, if needed
        required: false
      GENERIC_PASSWORD_1:
        description: Generic secret to pass a password to the workflow, if needed
        required: false
      GENERIC_USERNAME_2:
        description: Generic secret to pass another username to the workflow, if needed
        required: false
      GENERIC_PASSWORD_2:
        description: Generic secret to pass another password to the workflow, if needed
        required: false
      PLUGIN_DEPENDENCIES_TOKEN:
        description: Read-only token (fine-grained, Contents read) for the plugin dependencies which are not publicly readable; only used to clone those, never exported to the test steps
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.moodle-core-branch || 'auto' }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    outputs:
      matrix-static: ${{ steps.preflight-matrix.outputs.matrix-static }}
      matrix-run: ${{ steps.preflight-matrix.outputs.matrix-run }}
      matrix-verify: ${{ steps.preflight-matrix.outputs.matrix-verify }}
      moodle-core-branch: ${{ steps.determine-branch.outputs.moodle-core-branch }}
      mustache-lint-extended: ${{ steps.mustache-lint-files.outputs.mustache-lint-extended }}
      phpcs-continue-on-error: ${{ steps.resolve-inputs.outputs.phpcs-continue-on-error }}
      mustache-continue-on-error: ${{ steps.resolve-inputs.outputs.mustache-continue-on-error }}
      scss-deprecations: ${{ steps.resolve-inputs.outputs.scss-deprecations }}
      behat-strict: ${{ steps.resolve-inputs.outputs.behat-strict }}
      codebase-check-completeness: ${{ steps.resolve-inputs.outputs.codebase-check-completeness }}
      codebase-check-completeness-casesensitive: ${{ steps.resolve-inputs.outputs.codebase-check-completeness-casesensitive }}
      codebase-check-languagepacks: ${{ steps.resolve-inputs.outputs.codebase-check-languagepacks }}
    steps:
      - name: Checkout calling plugin repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: calling-repo
          persist-credentials: false

      - name: Determine Moodle core branch
        id: determine-branch
        run: |
          # If a moodle-core-branch input is provided, use it.
          if [ -n "${{ inputs.moodle-core-branch }}" ]; then
            MOODLE_BRANCH="${{ inputs.moodle-core-branch }}"
            echo "Using provided moodle-core-branch: $MOODLE_BRANCH"
          # If not provided, auto-detect from current branch and plugin configuration.
          else
            # Get the calling repository and branch.
            CURRENT_BRANCH="${{ github.ref_name }}"
            echo "Current branch: $CURRENT_BRANCH"

            # If current branch matches MOODLE_xxx_STABLE pattern, use it.
            if [[ "$CURRENT_BRANCH" =~ ^MOODLE_[0-9]+_STABLE$ ]]; then
              MOODLE_BRANCH="$CURRENT_BRANCH"
              echo "Using current branch: $MOODLE_BRANCH"
            # If on main branch, find the highest available MOODLE_xxx_STABLE branch.
            elif [ "$CURRENT_BRANCH" = "main" ]; then
              echo "Main branch detected, searching for highest MOODLE_xxx_STABLE branch..."

              # Get all remote MOODLE_xxx_STABLE branches and find the highest number
              HIGHEST_BRANCH=$(cd calling-repo && git branch -r | grep -E 'origin/MOODLE_[0-9]+_STABLE' | \
                sed 's|origin/||' | sed 's/MOODLE_\([0-9]\+\)_STABLE/\1 &/' | \
                sort -n | tail -1 | awk '{print $2}')

              if [ -n "$HIGHEST_BRANCH" ]; then
                MOODLE_BRANCH="$HIGHEST_BRANCH"
                echo "Found highest MOODLE branch: $MOODLE_BRANCH"
              else
                echo "No MOODLE_xxx_STABLE branches found, checking version.php..."
                MOODLE_BRANCH="" # Will be handled by version.php fallback below
              fi
            # For any other branch, we'll use the version.php fallback
            else
              echo "Branch '$CURRENT_BRANCH' doesn't match known patterns, checking version.php..."
              MOODLE_BRANCH="" # Will be handled by version.php fallback below
            fi

            # Fallback: Extract Moodle version from version.php
            if [ -z "$MOODLE_BRANCH" ]; then
              if [ -f "calling-repo/version.php" ]; then
                # Look for $plugin->supported = [min, max]; pattern
                SUPPORTED_LINE=$(grep -E '^\$plugin->supported\s*=' calling-repo/version.php | head -1)

                if [ -n "$SUPPORTED_LINE" ]; then
                  echo "Found supported line: $SUPPORTED_LINE"

                  # Extract the second number from the array [min, max]
                  MAX_VERSION=$(echo "$SUPPORTED_LINE" | sed -E 's/.*\[\s*[0-9]+\s*,\s*([0-9]+)\s*\].*/\1/')

                  if [[ "$MAX_VERSION" =~ ^[0-9]+$ ]]; then
                    MOODLE_BRANCH="MOODLE_${MAX_VERSION}_STABLE"
                    echo "Extracted maximum supported version: $MAX_VERSION"
                    echo "Using derived Moodle branch: $MOODLE_BRANCH"
                  else
                    echo "Error: Could not parse maximum version from: $SUPPORTED_LINE"
                    exit 1
                  fi
                else
                  echo "Warning: No \$plugin->supported line found in version.php"
                  echo "Attempting to determine the highest available MOODLE_xxx_STABLE branch from Moodle core repository..."

                  # Fetch the latest MOODLE_xxx_STABLE branches from the official Moodle repository
                  HIGHEST_MOODLE_BRANCH=$(git ls-remote --heads https://github.com/moodle/moodle.git 'refs/heads/MOODLE_*_STABLE' | \
                    sed 's|.*refs/heads/||' | sed 's/MOODLE_\([0-9]\+\)_STABLE/\1 &/' | \
                    sort -n | tail -1 | awk '{print $2}')

                  if [ -n "$HIGHEST_MOODLE_BRANCH" ]; then
                    MOODLE_BRANCH="$HIGHEST_MOODLE_BRANCH"
                    echo "Using highest available Moodle core branch: $MOODLE_BRANCH"
                  else
                    echo "Error: Could not determine highest MOODLE_xxx_STABLE branch from Moodle core repository"
                    echo "Error: Please provide an explicit 'moodle-core-branch' input parameter"
                    exit 1
                  fi
                fi
              else
                echo "Error: No version.php file found in repository root"
                echo "Error: This does not seem to be a Moodle plugin."
                exit 1
              fi
            fi
          fi

          echo "moodle-core-branch=$MOODLE_BRANCH" >> $GITHUB_OUTPUT
          echo "Final Moodle branch: $MOODLE_BRANCH"

      # Some inputs control the behaviour of the workflow as a whole rather than the testing of a particular plugin.
      # To avoid repeating them in the caller workflow of each and every plugin repository, they can also be set
      # organization-wide (or repository-wide) via configuration variables. This step resolves the effective value
      # of each of these inputs with the precedence: caller workflow input, then configuration variable, then default.
      # As these inputs have default values, an input which the caller did not set cannot be told apart from an input
      # which the caller explicitly set to its default value. Therefore an input which deviates from its default
      # always wins, while an input at its default value lets the configuration variable decide.
      - name: Resolve inputs with configuration variable fallback
        id: resolve-inputs
        env:
          INPUT_PHPCS_CONTINUE_ON_ERROR: ${{ inputs.phpcs-continue-on-error }}
          INPUT_MUSTACHE_CONTINUE_ON_ERROR: ${{ inputs.mustache-continue-on-error }}
          INPUT_SCSS_DEPRECATIONS: ${{ inputs.scss-deprecations }}
          INPUT_BEHAT_STRICT: ${{ inputs.behat-strict }}
          INPUT_CODEBASE_CHECK_COMPLETENESS: ${{ inputs.codebase-check-completeness }}
          INPUT_CODEBASE_CHECK_COMPLETENESS_CASESENSITIVE: ${{ inputs.codebase-check-completeness-casesensitive }}
          INPUT_CODEBASE_CHECK_LANGUAGEPACKS: ${{ inputs.codebase-check-languagepacks }}
          VAR_PHPCS_CONTINUE_ON_ERROR: ${{ vars.MOODLE_PLUGIN_CI_PHPCS_CONTINUE_ON_ERROR }}
          VAR_MUSTACHE_CONTINUE_ON_ERROR: ${{ vars.MOODLE_PLUGIN_CI_MUSTACHE_CONTINUE_ON_ERROR }}
          VAR_SCSS_DEPRECATIONS: ${{ vars.MOODLE_PLUGIN_CI_SCSS_DEPRECATIONS }}
          VAR_BEHAT_STRICT: ${{ vars.MOODLE_PLUGIN_CI_BEHAT_STRICT }}
          VAR_CODEBASE_CHECK_COMPLETENESS: ${{ vars.MOODLE_PLUGIN_CI_CODEBASE_CHECK_COMPLETENESS }}
          VAR_CODEBASE_CHECK_COMPLETENESS_CASESENSITIVE: ${{ vars.MOODLE_PLUGIN_CI_CODEBASE_CHECK_COMPLETENESS_CASESENSITIVE }}
          VAR_CODEBASE_CHECK_LANGUAGEPACKS: ${{ vars.MOODLE_PLUGIN_CI_CODEBASE_CHECK_LANGUAGEPACKS }}
        run: |
          # Usage: resolve <input name> <input value> <variable name> <variable value> <default value> <allowed values>
          # (the allowed values are given as a single space-separated string)
          resolve() {
            local name="$1" input="$2" varname="$3" var="$4" default="$5" allowed="$6"
            local value source
            # Normalise the input and the variable to lowercase and accept only the allowed values
            # (an unset input falls back to the default, an unset variable is ignored).
            input="${input,,}"
            var="${var,,}"
            [ -n "$input" ] || input="$default"
            if [[ " $allowed " != *" $input "* ]]; then
              echo "::error::Invalid value '$input' for the input $name. Allowed values are: ${allowed// /, }."
              exit 1
            fi
            if [ -n "$var" ] && [[ " $allowed " != *" $var "* ]]; then
              echo "::error::Invalid value '$var' for the configuration variable $varname. Allowed values are: ${allowed// /, }."
              exit 1
            fi
            if [ "$input" != "$default" ]; then
              value="$input"
              source="caller workflow input"
            elif [ -n "$var" ]; then
              value="$var"
              source="configuration variable $varname"
            else
              value="$default"
              source="default"
            fi
            echo "$name: $value (from $source)"
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          }
          resolve phpcs-continue-on-error "$INPUT_PHPCS_CONTINUE_ON_ERROR" MOODLE_PLUGIN_CI_PHPCS_CONTINUE_ON_ERROR "$VAR_PHPCS_CONTINUE_ON_ERROR" false "true false"
          resolve mustache-continue-on-error "$INPUT_MUSTACHE_CONTINUE_ON_ERROR" MOODLE_PLUGIN_CI_MUSTACHE_CONTINUE_ON_ERROR "$VAR_MUSTACHE_CONTINUE_ON_ERROR" false "true false"
          resolve scss-deprecations "$INPUT_SCSS_DEPRECATIONS" MOODLE_PLUGIN_CI_SCSS_DEPRECATIONS "$VAR_SCSS_DEPRECATIONS" true "true false"
          resolve behat-strict "$INPUT_BEHAT_STRICT" MOODLE_PLUGIN_CI_BEHAT_STRICT "$VAR_BEHAT_STRICT" true "true false"
          resolve codebase-check-completeness "$INPUT_CODEBASE_CHECK_COMPLETENESS" MOODLE_PLUGIN_CI_CODEBASE_CHECK_COMPLETENESS "$VAR_CODEBASE_CHECK_COMPLETENESS" standard "off standard extended"
          resolve codebase-check-completeness-casesensitive "$INPUT_CODEBASE_CHECK_COMPLETENESS_CASESENSITIVE" MOODLE_PLUGIN_CI_CODEBASE_CHECK_COMPLETENESS_CASESENSITIVE "$VAR_CODEBASE_CHECK_COMPLETENESS_CASESENSITIVE" true "true false"
          resolve codebase-check-languagepacks "$INPUT_CODEBASE_CHECK_LANGUAGEPACKS" MOODLE_PLUGIN_CI_CODEBASE_CHECK_LANGUAGEPACKS "$VAR_CODEBASE_CHECK_LANGUAGEPACKS" true "true false"

      - name: Check for Mustache Lint upstream and baseline files
        id: mustache-lint-files
        run: |
          # If the plugin contains .upstream template files or a .mustachelintbaseline file, the extended Mustache Lint is used.
          if [ -f calling-repo/.mustachelintbaseline ] || find calling-repo -path calling-repo/.git -prune -o -name '*.mustache.upstream' -print | grep -q .; then
            echo "Found .upstream template files or a .mustachelintbaseline file, the extended Mustache Lint will be used."
            echo "mustache-lint-extended=true" >> $GITHUB_OUTPUT
          else
            echo "Found neither .upstream template files nor a .mustachelintbaseline file, the standard Mustache Lint will be used."
            echo "mustache-lint-extended=false" >> $GITHUB_OUTPUT
          fi

      - name: Check out moodle-workflows repository code
        uses: actions/checkout@v6
        with:
          repository: moodle-an-hochschulen/moodle-workflows
          ref: main
          path: preflight
          persist-credentials: false

      - name: Create CI matrix from JSON
        id: preflight-matrix
        run: |
          # Use the detected branch from the previous step
          DETECTED_BRANCH="${{ steps.determine-branch.outputs.moodle-core-branch }}"

          # Read the matrix configuration for the detected moodle-core-branch
          MATRIX_FILE="preflight/.github/workflows/moodle-plugin-ci.matrix/matrix.json"
          BRANCH_CONFIG=$(jq -c --arg branch "$DETECTED_BRANCH" '.[$branch]' "$MATRIX_FILE")

          # Fail with a clear message if the detected branch is not configured in matrix.json.
          # Without this check, the subsequent jq calls would fail with a cryptic "null (null) cannot be iterated over" error.
          if [ -z "$BRANCH_CONFIG" ] || [ "$BRANCH_CONFIG" = "null" ]; then
            AVAILABLE_BRANCHES=$(jq -r 'keys_unsorted | join(", ")' "$MATRIX_FILE")
            echo "::error::The Moodle core branch '$DETECTED_BRANCH' is not configured in the CI matrix of the moodle-workflows repository. Configured branches: $AVAILABLE_BRANCHES. Please add the branch to https://github.com/moodle-an-hochschulen/moodle-workflows/blob/main/.github/workflows/moodle-plugin-ci.matrix/matrix.json or pass one of the configured branches via the 'moodle-core-branch' input."
            exit 1
          fi

          # Create the run matrix with highest PHP version and postgres only
          MATRIX_RUN_JSON=$(echo "$BRANCH_CONFIG" | jq -c '
            [{
              "moodle-core-branch": $ARGS.named.branch,
              "php": (.php | max),
              "database": "pgsql",
              "extensions": ((.extensions // []) | join(","))
            }]' --arg branch "$DETECTED_BRANCH")

          # Add custom PHP extensions if provided
          if [ -n "${{ inputs.php-extensions }}" ]; then
            CUSTOM_EXTENSIONS='${{ inputs.php-extensions }}'
            MATRIX_RUN_JSON=$(echo "$MATRIX_RUN_JSON" | jq -c --arg ext "$CUSTOM_EXTENSIONS" '
              map(.extensions = if .extensions == "" then $ext else (.extensions + "," + $ext) end)
            ')
          fi

          # Split into parallel Behat slices if requested (cross-product each entry with slice indices).
          BEHAT_SLICES="${{ inputs.behat-slices }}"
          if [ -n "$BEHAT_SLICES" ] && [ "$BEHAT_SLICES" -gt 1 ]; then
            MATRIX_RUN_JSON=$(echo "$MATRIX_RUN_JSON" | jq -c --argjson n "$BEHAT_SLICES" '
              [ .[] as $e | range(0; $n) as $s | $e + {"behat-slice": $s} ]')
          fi

          echo "matrix-run={\"include\":$MATRIX_RUN_JSON}" >> $GITHUB_OUTPUT

          # Create the verify matrix with remaining combinations (excluding the initial one)
          if [ "${{ inputs.one-db-only }}" = "true" ]; then
            # Use only PostgreSQL when one-db-only is true, but exclude the highest PHP version
            MATRIX_VERIFY_JSON=$(echo "$BRANCH_CONFIG" | jq -c '
              [.php[] as $php | select($php != (.php | max)) | {
                "moodle-core-branch": $ARGS.named.branch,
                "php": $php,
                "database": "pgsql",
                "extensions": ((.extensions // []) | join(","))
              }]' --arg branch "$DETECTED_BRANCH")
          else
            # Use all configured databases, but exclude highest PHP + PostgreSQL combination
            MATRIX_VERIFY_JSON=$(echo "$BRANCH_CONFIG" | jq -c '
              [.php[] as $php | .database[] as $db |
               select(($php == (.php | max) and $db == "pgsql") | not) | {
                "moodle-core-branch": $ARGS.named.branch,
                "php": $php,
                "database": $db,
                "extensions": ((.extensions // []) | join(","))
              }]' --arg branch "$DETECTED_BRANCH")
          fi

          # Add custom PHP extensions if provided
          if [ -n "${{ inputs.php-extensions }}" ]; then
            CUSTOM_EXTENSIONS='${{ inputs.php-extensions }}'
            MATRIX_VERIFY_JSON=$(echo "$MATRIX_VERIFY_JSON" | jq -c --arg ext "$CUSTOM_EXTENSIONS" '
              map(.extensions = if .extensions == "" then $ext else (.extensions + "," + $ext) end)
            ')
          fi

          # Split into parallel Behat slices if requested (cross-product each entry with slice indices).
          if [ -n "$BEHAT_SLICES" ] && [ "$BEHAT_SLICES" -gt 1 ]; then
            MATRIX_VERIFY_JSON=$(echo "$MATRIX_VERIFY_JSON" | jq -c --argjson n "$BEHAT_SLICES" '
              [ .[] as $e | range(0; $n) as $s | $e + {"behat-slice": $s} ]')
          fi

          echo "matrix-verify={\"include\":$MATRIX_VERIFY_JSON}" >> $GITHUB_OUTPUT

          # Create static matrix with highest PHP version and postgres only
          MATRIX_STATIC_JSON=$(echo "$BRANCH_CONFIG" | jq -c '
            {
              "moodle-core-branch": $ARGS.named.branch,
              "php": (.php | max),
              "database": "pgsql",
              "extensions": ((.extensions // []) | join(","))
            }' --arg branch "$DETECTED_BRANCH")

          # Add custom PHP extensions if provided
          if [ -n "${{ inputs.php-extensions }}" ]; then
            CUSTOM_EXTENSIONS='${{ inputs.php-extensions }}'
            MATRIX_STATIC_JSON=$(echo "$MATRIX_STATIC_JSON" | jq -c --arg ext "$CUSTOM_EXTENSIONS" '
              .extensions = if .extensions == "" then $ext else (.extensions + "," + $ext) end
            ')
          fi

          echo "matrix-static={\"include\":[$MATRIX_STATIC_JSON]}" >> $GITHUB_OUTPUT

      - name: (Debug) Generated CI Matrix
        run: |
          echo "Detected branch:"
          echo "${{ steps.determine-branch.outputs.moodle-core-branch }}"
          echo ""
          echo "Matrix for static job:"
          echo "${{ steps.preflight-matrix.outputs.matrix-static }}"
          echo ""
          echo "Matrix for run job:"
          echo "${{ steps.preflight-matrix.outputs.matrix-run }}"
          echo ""
          echo "Matrix for verify job:"
          echo "${{ steps.preflight-matrix.outputs.matrix-verify }}"

  static:
    name: Static checks
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    needs: preflight

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preflight.outputs.matrix-static) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        # On a self-hosted runner setup-php installs PHP from packages instead of GitHub's
        # prebuilt builds, which carry gd, intl, zip, sodium, exif and soap; core's composer
        # install needs gd at least (uaiblaine fork, see UAIBLAINE.md). opcache.enable_cli makes
        # setup-php switch the JIT on as well (opcache.jit=1235); on ARM64 that JIT crashes
        # PHP 8.4 while admin_apply_default_settings() loads Boost Union's settings.php, so it is
        # disabled there and opcache itself stays on.
        env:
          runner: ${{ inputs.runner != '' && 'self-hosted' || '' }}
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.runner != '' && format('{0}{1}gd, intl, zip, sodium, exif, soap', matrix.extensions, matrix.extensions != '' && ', ' || '') || matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1${{ runner.arch == 'ARM64' && ', opcache.jit=disable' || '' }}
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # A dependency that answers an anonymous `git ls-remote` is cloned exactly as MAH
      # clones it. Any other one is cloned with PLUGIN_DEPENDENCIES_TOKEN, which reaches
      # git only through GIT_CONFIG_* variables of that single add-plugin call (a
      # url.insteadOf rewrite of that one repository's URL): it is never written to disk,
      # never stored as the clone's origin URL, and invisible to the plugin code that the
      # later steps run. Secrets are withheld from pull requests opened from forks and by
      # Dependabot, so such runs stop here with the error below rather than at a git 128.
      - name: Add plugin dependencies
        if: ${{ inputs.plugin-dependencies != '' }}
        env:
          PLUGIN_DEPENDENCIES: ${{ inputs.plugin-dependencies }}
          DEPENDENCIES_TOKEN: ${{ secrets.PLUGIN_DEPENDENCIES_TOKEN }}
        run: |
          if [ -n "$DEPENDENCIES_TOKEN" ]; then
            echo "::add-mask::$DEPENDENCIES_TOKEN"
          fi
          # Process plugin dependencies line by line, skipping empty lines
          printf '%s\n' "$PLUGIN_DEPENDENCIES" | while IFS=',' read -r repo branch; do
            # Skip empty lines
            if [ -n "$repo" ] && [ -n "$branch" ]; then
              echo "Adding plugin dependency: $repo (branch: $branch)"
              if GIT_TERMINAL_PROMPT=0 git ls-remote "https://github.com/$repo.git" HEAD > /dev/null 2>&1; then
                moodle-plugin-ci add-plugin --branch "$branch" "$repo"
              elif [ -n "$DEPENDENCIES_TOKEN" ]; then
                echo "$repo is not publicly readable, cloning it with the PLUGIN_DEPENDENCIES_TOKEN secret."
                GIT_TERMINAL_PROMPT=0 \
                  GIT_CONFIG_COUNT=1 \
                  GIT_CONFIG_KEY_0="url.https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/${repo}.insteadOf" \
                  GIT_CONFIG_VALUE_0="https://github.com/${repo}" \
                  moodle-plugin-ci add-plugin --branch "$branch" "$repo"
              else
                echo "::error::The plugin dependency $repo is not publicly readable and no PLUGIN_DEPENDENCIES_TOKEN secret reached this workflow. Map it in the secrets block of the calling ci.yml job; pull requests from forks and from Dependabot never receive secrets."
                exit 1
              fi
            fi
          done

      - name: Run pre-install script
        if: ${{ inputs.pre-install-script != '' }}
        run: ${{ inputs.pre-install-script }}

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-core-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        continue-on-error: ${{ needs.preflight.outputs.phpcs-continue-on-error == 'true' }}
        run: moodle-plugin-ci phpcs --max-warnings ${{ inputs.phpcs-max-warnings }}

      - name: Pull request content checker
        uses: JJ/github-pr-contains-action@releases/v14
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (inputs.pr-check-diff-contains != '' || inputs.pr-check-diff-does-not-contain != '' || inputs.pr-check-body-contains != '' || inputs.pr-check-body-does-not-contain != '' || inputs.pr-check-files-changed != '' || inputs.pr-check-lines-changed != '' || inputs.pr-check-waived-users != '') }}
        with:
          github-token: ${{ github.token }}
          diffContains: ${{ inputs.pr-check-diff-contains }}
          diffDoesNotContain: ${{ inputs.pr-check-diff-does-not-contain }}
          bodyContains: ${{ inputs.pr-check-body-contains }}
          bodyDoesNotContain: ${{ inputs.pr-check-body-does-not-contain }}
          filesChanged: ${{ inputs.pr-check-files-changed }}
          linesChanged: ${{ inputs.pr-check-lines-changed }}
          waivedUsers: ${{ inputs.pr-check-waived-users }}

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings ${{ inputs.phpdoc-max-warnings }}

      - name: Development Leftover Checker
        if: ${{ !cancelled() }}
        run: |
          echo "Checking for development leftovers..."

          # Define patterns to search for
          PATTERNS=("@testme" "TODO" "<<<<<<< HEAD")

          # Third-party code declared in thirdpartylibs.xml is not ours to clean (uaiblaine delta): skip each
          # declared location and, for an AMD source, the build files generated from it.
          SKIP=()
          if [ -f ./plugin/thirdpartylibs.xml ]; then
            while IFS= read -r loc; do
              loc="${loc%/}"
              [ -n "$loc" ] || continue
              SKIP+=("./plugin/$loc")
              case "$loc" in
                amd/src/*.js)
                  b="${loc#amd/src/}"
                  b="${b%.js}"
                  SKIP+=("./plugin/amd/build/$b.min.js" "./plugin/amd/build/$b.min.js.map")
                  ;;
              esac
            done < <(grep -oE '<location>[^<]+</location>' ./plugin/thirdpartylibs.xml | sed -E 's#</?location>##g')
          fi
          is_skipped() {
            local s
            for s in "${SKIP[@]}"; do
              if [[ "$1" == "$s" || "$1" == "$s"/* ]]; then
                return 0
              fi
            done
            return 1
          }
          FILES=()
          while IFS= read -r f; do
            is_skipped "$f" || FILES+=("$f")
          done < <(find ./plugin -type f -not -path '*/.git/*' -not -path '*/node_modules/*' -not -path '*/vendor/*' | sort)
          echo "Skipping ${#SKIP[@]} third-party path(s) declared in thirdpartylibs.xml."

          # Check each pattern
          FOUND_ISSUES=false
          for pattern in "${PATTERNS[@]}"; do
            echo "Searching for: $pattern"
            if [ "${#FILES[@]}" -gt 0 ] && grep -nH -- "$pattern" "${FILES[@]}"; then
              FOUND_ISSUES=true
              echo ""
            fi
          done

          # Fail if any issues were found
          if [ "$FOUND_ISSUES" = true ]; then
            echo "Development leftovers detected! Please clean up the code."
            exit 1
          else
            echo "No development leftovers found."
          fi

      - name: Plugin Codebase Completeness Checker
        if: ${{ !cancelled() && needs.preflight.outputs.codebase-check-completeness != 'off' }}
        uses: moodle-an-hochschulen/moodle-workflows/.github/actions/codebase-check@main
        with:
          mode: ${{ needs.preflight.outputs.codebase-check-completeness }}
          plugin-dir: plugin
          case-sensitive: ${{ needs.preflight.outputs.codebase-check-completeness-casesensitive }}

      - name: Language Pack Checker
        if: ${{ !cancelled() && needs.preflight.outputs.codebase-check-languagepacks == 'true' }}
        uses: moodle-an-hochschulen/moodle-workflows/.github/actions/languagepack-check@main
        with:
          plugin-dir: plugin

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      # Intermediate fix for https://github.com/moodlehq/moodle-plugin-ci/issues/400:
      # On Moodle 5.1+, the Mustache linter looks for ESLint and its configuration within the public directory instead of
      # the Moodle root directory and thus does not lint the JS in Mustache templates anymore.
      # This step and the cleanup step after the Mustache Lint steps can be removed again as soon as the upstream issue is fixed.
      - name: Make ESLint available for Mustache Lint on Moodle 5.1+
        if: ${{ !cancelled() }}
        run: |
          MOODLE_DIR=$(grep '^MOODLE_DIR=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          if [ -n "$MOODLE_DIR" ] && [ -d "$MOODLE_DIR/public" ]; then
            for ITEM in node_modules .eslintrc; do
              if [ -e "$MOODLE_DIR/$ITEM" ] && [ ! -e "$MOODLE_DIR/public/$ITEM" ]; then
                ln -s "../$ITEM" "$MOODLE_DIR/public/$ITEM"
                echo "Created symlink $MOODLE_DIR/public/$ITEM -> ../$ITEM"
              fi
            done
          else
            echo "Moodle does not use the public directory structure, nothing to do."
          fi

      - name: Mustache Lint
        if: ${{ !cancelled() && needs.preflight.outputs.mustache-lint-extended != 'true' }}
        continue-on-error: ${{ needs.preflight.outputs.mustache-continue-on-error == 'true' }}
        run: moodle-plugin-ci mustache

      - name: Mustache Lint (with upstream templates and baseline file)
        if: ${{ !cancelled() && needs.preflight.outputs.mustache-lint-extended == 'true' }}
        continue-on-error: ${{ needs.preflight.outputs.mustache-continue-on-error == 'true' }}
        uses: moodle-an-hochschulen/moodle-workflows/.github/actions/mustache-lint@main

      # Cleanup for the intermediate fix for https://github.com/moodlehq/moodle-plugin-ci/issues/400 (see above).
      - name: Remove ESLint symlinks for Mustache Lint on Moodle 5.1+
        if: ${{ always() }}
        run: |
          MOODLE_DIR=$(grep '^MOODLE_DIR=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          if [ -n "$MOODLE_DIR" ]; then
            for ITEM in node_modules .eslintrc; do
              if [ -L "$MOODLE_DIR/public/$ITEM" ]; then
                rm "$MOODLE_DIR/public/$ITEM"
                echo "Removed symlink $MOODLE_DIR/public/$ITEM"
              fi
            done
          fi

      # uaiblaine delta: moodle-plugin-ci runs core's gherkinlint task from the Moodle root, which lints
      # every feature in the tree, so two plugin dependencies sharing a feature name (mod_customcert and
      # tool_certificate share seven) fail the plugin under test on files it does not own. Core's task
      # reads a .gherkin-lintignore at the Moodle root: it is written here with the directory each
      # dependency was installed in, so the plugin's own features stay linted against core's, with
      # core's rules, and the dependencies' are not linted at all. node_modules/** is gherkin-lint's
      # default, which any ignore file replaces. The function is bin/lib/mah-parity.sh's in
      # uaiblaine/moodle-dev, copied verbatim, where `mdl selfcheck mahparity` tests it.
      - name: Grunt
        if: ${{ !cancelled() }}
        run: |
          mah_gherkin_lintignore() {
              local moodle="$1" extras="$2" dir comp type typedir
              echo 'node_modules/**'
              for dir in "$extras"/*/; do
                  [ -d "$dir" ] || continue
                  comp="$(sed -n "/^[[:space:]]*\$plugin->component[[:space:]]*=/{s/^[^=]*=[[:space:]]*'\([a-z0-9_]*\)'.*/\1/p;q;}" \
                      "${dir}version.php" 2>/dev/null)" || comp=""
                  type="${comp%%_*}"
                  typedir=""
                  if [ -n "$comp" ] && [ "$type" != "$comp" ]; then
                      typedir="$(awk -v t="$type" '
                          /"plugintypes"[[:space:]]*:/ { inblock = 1; next }
                          inblock && /}/ { exit }
                          inblock && $0 ~ "^[[:space:]]*\"" t "\"[[:space:]]*:" {
                              v = $0
                              sub(/^[^:]*:[[:space:]]*"/, "", v)
                              sub(/".*$/, "", v)
                              gsub(/\\\//, "/", v)
                              print v
                              exit
                          }' "$moodle/lib/components.json")"
                  fi
                  if [ -z "$typedir" ]; then
                      echo "gherkinlint: cannot place the dependency ${dir%/} (component '$comp') in $moodle/lib/components.json" >&2
                      return 1
                  fi
                  echo "$typedir/${comp#*_}/**"
              done
          }
          MOODLE_DIR=$(grep '^MOODLE_DIR=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          EXTRA_PLUGINS_DIR=$(grep '^EXTRA_PLUGINS_DIR=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          # `moodle-plugin-ci install` rewrites ci/.env with its own values only, dropping the
          # EXTRA_PLUGINS_DIR that add-plugin wrote; fall back to add-plugin's default storage.
          [ -n "$EXTRA_PLUGINS_DIR" ] || EXTRA_PLUGINS_DIR="$PWD/moodle-plugin-ci-plugins"
          if [ -n "$MOODLE_DIR" ] && [ -n "$EXTRA_PLUGINS_DIR" ] && [ -d "$EXTRA_PLUGINS_DIR" ]; then
            if ! mah_gherkin_lintignore "$MOODLE_DIR" "$EXTRA_PLUGINS_DIR" > "$MOODLE_DIR/.gherkin-lintignore"; then
              echo "::error::Could not list the plugin dependencies for gherkinlint to skip."
              exit 1
            fi
            echo "gherkinlint skips the plugin dependencies' features, .gherkin-lintignore:"
            sed 's/^/    /' "$MOODLE_DIR/.gherkin-lintignore"
          fi
          moodle-plugin-ci grunt --max-lint-warnings ${{ inputs.grunt-max-lint-warnings }}

      # The committed ES module build of a Moodle 5.3+ plugin (uaiblaine fork, UAIBLAINE.md change 6).
      # `moodle-plugin-ci grunt` runs a fixed task list (amd, yui, gherkinlint, stylelint) and then
      # hashes the plugin's *.js against a pre-run backup, so it reads js/esm/build and always finds
      # it unchanged: no task rebuilt it, and a stale React build passes. Core 5.3's `grunt esm`
      # (.grunt/tasks/esm.js) deletes every component's js/esm/build before rebuilding, writes a
      # .dev.js variant beside each output and rewrites js/esm/src/swizzle.json, so the check
      # rebuilds the installed copy in place and compares its whole js/esm with the checkout's.
      # The task rebuilds every component in the tree, core's and the dependencies' too: their
      # js/esm/build directories are archived first and put back afterwards, and only the plugin's
      # own js/esm is compared. A plugin whose js/esm/bundle.json opts into one bundled output gets
      # it rebuilt after the task, which deletes it, by the script below. The copy is restored
      # afterwards, so the Jest step reads the plugin as installed. Skips, both passing: no
      # js/esm/src (silently), and a core without .grunt/tasks/esm.js (5.2 and older, said so).
      # The function mirrors esm_tree_check in uaiblaine/moodle-dev's bin/mdl-ci, and the bundle
      # script is its ci/esm-bundle.mjs, copied verbatim: keep the three in step.
      - name: ESM build check
        if: ${{ !cancelled() }}
        run: |
          esm_tree_check() {  # $1 = the checked-out plugin, $2 = its installed copy, $3 = the bundle script; cwd = the Moodle root
              local committed="$1" copy="$2" bundler="$3" backup="$RUNNER_TEMP/esm-backup" \
                  others="$RUNNER_TEMP/esm-others.tar" verdict=0 report drc=0 builds
              rm -rf "$backup" "$others"
              cp -a "$copy/js/esm" "$backup" || return 1
              builds="$(find . -path ./node_modules -prune -o -type d \
                  -path '*/js/esm/build' ! -path "./${copy#"$PWD"/}/js/esm/build" -print)"
              if [ -n "$builds" ]; then
                  tar -cf "$others" -T - <<<"$builds" || return 1
              fi
              echo "esm: npx grunt esm (core 5.3+), then the whole js/esm compared with a fresh build"
              npx grunt esm || verdict=1
              if [ "$verdict" -eq 0 ] && [ -f "$copy/js/esm/bundle.json" ]; then
                  node "$bundler" "$copy" || verdict=1
              fi
              if [ "$verdict" -eq 0 ]; then
                  report="$(diff -rq "$committed/js/esm" "$copy/js/esm" 2>&1)" || drc=$?
                  if [ "$drc" -eq 0 ]; then
                      echo "js/esm matches a fresh build"
                  elif [ "$drc" -eq 1 ]; then
                      awk -v a="$committed/js/esm" -v b="$copy/js/esm" '
                          function rel(p, root) { return "js/esm" substr(p, length(root) + 1) }
                          /^Only in / {
                              rest = substr($0, 9); i = index(rest, ": ")
                              dir = substr(rest, 1, i - 1); name = substr(rest, i + 2)
                              if (index(dir, b) == 1) {
                                  print "::error file=" rel(dir, b) "/" name "::" rel(dir, b) "/" name " is produced by a fresh build but not committed: add it"
                              } else {
                                  print "::error file=" rel(dir, a) "/" name "::" rel(dir, a) "/" name " is committed but a fresh build does not produce it: delete it"
                              }
                              next
                          }
                          /^Files / && / differ$/ {
                              p = substr($0, 7); p = substr(p, 1, index(p, " and ") - 1)
                              print "::error file=" rel(p, a) "::" rel(p, a) " differs from a fresh build: it is stale"
                              next
                          }
                          { print }
                      ' <<<"$report"
                      echo "::error::The committed js/esm is not what core's grunt esm builds from js/esm/src. Rebuild it on a Moodle 5.3 site (npx grunt esm) and commit js/esm (build/ and src/swizzle.json)."
                      verdict=1
                  else
                      echo "$report"
                      verdict=1
                  fi
              fi
              if ! { rm -rf "$copy/js/esm" && cp -a "$backup" "$copy/js/esm" && rm -rf "$backup"; }; then
                  echo "::error::esm: could not restore $copy/js/esm from $backup"
                  verdict=1
              fi
              if [ -n "$builds" ]; then
                  # Removed first, so an output grunt wrote that the archive does not hold goes too.
                  if ! { xargs rm -rf <<<"$builds" && tar -xf "$others" && rm -f "$others"; }; then
                      echo "::error::esm: could not restore the other components' js/esm/build from $others"
                      verdict=1
                  fi
              fi
              return "$verdict"
          }
          [ -d ./plugin/js/esm/src ] || exit 0
          MOODLE_DIR=$(grep '^MOODLE_DIR=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          PLUGIN_DIR=$(grep '^PLUGIN_DIR=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          NVM_BIN_DIR=$(grep '^RUNTIME_NVM_BIN=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          if [ -z "$MOODLE_DIR" ] || [ -z "$PLUGIN_DIR" ] || [ ! -d "$PLUGIN_DIR/js/esm/src" ]; then
            echo "::error::Could not find the installed copy of the plugin (MOODLE_DIR/PLUGIN_DIR in ci/.env) to rebuild js/esm in."
            exit 1
          fi
          if [ ! -f "$MOODLE_DIR/.grunt/tasks/esm.js" ]; then
            echo "esm: core has no .grunt/tasks/esm.js (Moodle 5.2 and older), skipping the js/esm build check"
            exit 0
          fi
          # The Node that `moodle-plugin-ci install` chose from core's .nvmrc, as its own commands use it.
          if [ -n "$NVM_BIN_DIR" ]; then
            export PATH="$NVM_BIN_DIR:$PATH"
          fi
          COMMITTED="$PWD/plugin"
          BUNDLER="$RUNNER_TEMP/esm-bundle.mjs"
          cat > "$BUNDLER" <<'ESMBUNDLE'
          // Bundle a plugin's React client into one ES module, beside core's per-file build.
          //
          // Core's 5.2 `grunt react` writes one output per source under js/esm/src and keeps a
          // plugin's own relative imports external (.esbuild/plugin/plugincomponents.mjs), so a
          // component tree of N files is N requests, discovered level by level. A plugin that wants
          // one file opts in with a marker, js/esm/bundle.json, naming its entry and its output:
          //
          //     {"entry": "src/Block.tsx", "outfile": "build/bundle.js"}
          //
          // This script runs esbuild with `bundle: true` over that entry with the same options core
          // uses (format esm, react and @moodle/lms/* external, automatic JSX, minified, linked
          // source map, production define) minus the plugin that keeps relative imports external —
          // which is exactly the option a bundle exists to drop. Beside the output it writes
          // `<outfile>.manifest.json`: the SHA-1 of every source under js/esm/src, so a PHPUnit test
          // in the plugin can tell a stale bundle from a fresh one, which core's grunt diff check
          // cannot see. The per-file outputs stay where core's task puts them.
          //
          // Moodle 5.3's `grunt esm` (the task 5.2 called `react`) deletes js/esm/build before it
          // rebuilds, so the bundle is built AFTER core's task, by both callers. It writes a .dev.js
          // variant per source; the bundle gets none, and core's import map falls back to the .js
          // when no .dev.js exists.
          //
          // Usage (from the Moodle root, where node_modules/esbuild lives):
          //     node esm-bundle.mjs <plugin dir> [--out <dir>]
          // With --out the bundle and the manifest are written under <dir> instead of the plugin's
          // js/esm, which is how `mdl ci` checks the committed bundle without touching the mount.
          //
          // esbuild is resolved from the CURRENT DIRECTORY's node_modules, not from this file's
          // location: the script is mounted into a container at a path that carries no
          // node_modules of its own, and both callers run it with the Moodle root as cwd.

          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const args = process.argv.slice(2);
          const plugin = args[0];
          if (!plugin) {
              console.error('esm-bundle: usage: node esm-bundle.mjs <plugin dir> [--out <dir>]');
              process.exit(2);
          }
          const outflag = args.indexOf('--out');
          const outroot = outflag !== -1 ? args[outflag + 1] : null;
          if (outflag !== -1 && !outroot) {
              console.error('esm-bundle: --out needs a directory');
              process.exit(2);
          }

          const esm = path.resolve(plugin, 'js/esm');
          const markerpath = path.join(esm, 'bundle.json');
          if (!fs.existsSync(markerpath)) {
              console.error(`esm-bundle: no marker at ${markerpath}; nothing to bundle`);
              process.exit(2);
          }
          const marker = JSON.parse(fs.readFileSync(markerpath, 'utf8'));
          for (const key of ['entry', 'outfile']) {
              if (typeof marker[key] !== 'string' || marker[key] === '') {
                  console.error(`esm-bundle: bundle.json must name "${key}" (a path relative to js/esm)`);
                  process.exit(2);
              }
          }
          if (path.basename(marker.outfile).startsWith('bundle.') === false) {
              // Not a hard rule, but the plugin's own freshness test names the file; say so early.
              console.warn(`esm-bundle: outfile ${marker.outfile} is not named bundle.*; the plugin's tests may expect that`);
          }

          const entry = path.join(esm, marker.entry);
          const outfile = path.join(outroot ? path.resolve(outroot) : esm, marker.outfile);
          const manifestfile = outfile.replace(/\.js$/, '') + '.manifest.json';
          if (!fs.existsSync(entry)) {
              console.error(`esm-bundle: entry ${entry} does not exist`);
              process.exit(2);
          }

          // A source named like the output would be overwritten by core's per-file task on the next
          // grunt, silently, because that task maps a source to its output by name alone.
          const srcdir = path.join(esm, 'src');
          const outname = path.basename(marker.outfile).replace(/\.js$/, '');
          for (const ext of ['.ts', '.tsx']) {
              if (fs.existsSync(path.join(srcdir, outname + ext))) {
                  console.error(`esm-bundle: js/esm/src/${outname}${ext} would be overwritten by core's per-file build; rename one of them`);
                  process.exit(2);
              }
          }

          const require = createRequire(path.join(process.cwd(), 'package.json'));
          let esbuild;
          try {
              esbuild = require('esbuild');
          } catch (e) {
              console.error(`esm-bundle: esbuild is not resolvable from ${process.cwd()}; run from the Moodle root after npm install`);
              process.exit(2);
          }

          fs.mkdirSync(path.dirname(outfile), {recursive: true});
          await esbuild.build({
              entryPoints: [entry],
              outfile,
              bundle: true,
              format: 'esm',
              external: ['react', 'react/*', 'react-dom', 'react-dom/*', '@moodlehq/design-system', '@moodlehq/design-system/*', '@moodle/lms', '@moodle/lms/*'],
              jsx: 'automatic',
              minify: true,
              sourcemap: 'linked',
              define: {'process.env.NODE_ENV': '"production"'},
              logLevel: 'error',
          });

          // The manifest: every source under js/esm/src, sorted, with its SHA-1.
          const sources = {};
          const walk = (dir) => {
              for (const name of fs.readdirSync(dir).sort()) {
                  const full = path.join(dir, name);
                  if (fs.statSync(full).isDirectory()) {
                      walk(full);
                  } else if (/\.(ts|tsx)$/.test(name)) {
                      const rel = path.relative(esm, full).split(path.sep).join('/');
                      sources[rel] = crypto.createHash('sha1').update(fs.readFileSync(full)).digest('hex');
                  }
              }
          };
          walk(srcdir);
          const manifest = {entry: marker.entry, outfile: marker.outfile, sources};
          fs.writeFileSync(manifestfile, JSON.stringify(manifest, null, 4) + '\n');
          console.log(`esm-bundle: ${path.relative(process.cwd(), outfile)} (${Object.keys(sources).length} sources in the manifest)`);
          ESMBUNDLE
          cd "$MOODLE_DIR"
          esm_tree_check "$COMMITTED" "$PLUGIN_DIR" "$BUNDLER"

      # Jest over the plugin's js/esm/tests (uaiblaine fork, UAIBLAINE.md change 5): core's own
      # Jest, as Moodle 5.3+ ships it in jest.config.js at the root, over the installed copy of
      # the plugin only. Skips, both passing: no js/esm/tests (silently), and a core without
      # jest.config.js (5.2 and older, said so). The config reads the generated
      # tsconfig.aliases.json, which `grunt jsconfig` writes. A failing test fails the job.
      # The shell function is bin/lib/esm-jest.sh's in uaiblaine/moodle-dev, copied verbatim.
      - name: Jest
        if: ${{ !cancelled() }}
        run: |
          esm_jest() {
              local plugin="${1%/}"
              [[ -d "$plugin/js/esm/tests" ]] || return 0
              if [[ ! -f jest.config.js ]]; then
                  echo "jest: core has no jest.config.js (Moodle 5.2 and older), skipping $plugin/js/esm/tests"
                  return 0
              fi
              npx grunt jsconfig || return 1
              npx jest --ci "$plugin/js/esm/tests"
          }
          MOODLE_DIR=$(grep '^MOODLE_DIR=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          PLUGIN_DIR=$(grep '^PLUGIN_DIR=' ci/.env 2>/dev/null | cut -d= -f2-) || true
          if [ -z "$MOODLE_DIR" ] || [ -z "$PLUGIN_DIR" ]; then
            if [ -d ./plugin/js/esm/tests ]; then
              echo "::error::Could not find the installed copy of the plugin (MOODLE_DIR/PLUGIN_DIR in ci/.env) to run Jest over."
              exit 1
            fi
            exit 0
          fi
          cd "$MOODLE_DIR"
          esm_jest "${PLUGIN_DIR#"$MOODLE_DIR"/}"

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

  run:
    name: Runtime tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    needs: preflight
    env:
      GENERIC_USERNAME_1: ${{ secrets.GENERIC_USERNAME_1 }}
      GENERIC_PASSWORD_1: ${{ secrets.GENERIC_PASSWORD_1 }}
      GENERIC_USERNAME_2: ${{ secrets.GENERIC_USERNAME_2 }}
      GENERIC_PASSWORD_2: ${{ secrets.GENERIC_PASSWORD_2 }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      redis:
        image: ${{ inputs.redis-enabled && 'redis:latest' || '' }}
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preflight.outputs.matrix-run) }}

    steps: &runtime-steps
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Start additional service from Docker Compose
        if: ${{ inputs.docker-compose-file != '' }}
        uses: adambirds/docker-compose-action@v1.5.0
        with:
          compose-file: ${{ github.workspace }}/plugin/${{ inputs.docker-compose-file }}

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        # On a self-hosted runner setup-php installs PHP from packages instead of GitHub's
        # prebuilt builds, which carry gd, intl, zip, sodium, exif and soap; core's composer
        # install needs gd at least (uaiblaine fork, see UAIBLAINE.md). opcache.enable_cli makes
        # setup-php switch the JIT on as well (opcache.jit=1235); on ARM64 that JIT crashes
        # PHP 8.4 while admin_apply_default_settings() loads Boost Union's settings.php, so it is
        # disabled there and opcache itself stays on.
        env:
          runner: ${{ inputs.runner != '' && 'self-hosted' || '' }}
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.runner != '' && format('{0}{1}gd, intl, zip, sodium, exif, soap', matrix.extensions, matrix.extensions != '' && ', ' || '') || matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1${{ runner.arch == 'ARM64' && ', opcache.jit=disable' || '' }}
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # A dependency that answers an anonymous `git ls-remote` is cloned exactly as MAH
      # clones it. Any other one is cloned with PLUGIN_DEPENDENCIES_TOKEN, which reaches
      # git only through GIT_CONFIG_* variables of that single add-plugin call (a
      # url.insteadOf rewrite of that one repository's URL): it is never written to disk,
      # never stored as the clone's origin URL, and invisible to the plugin code that the
      # later steps run. Secrets are withheld from pull requests opened from forks and by
      # Dependabot, so such runs stop here with the error below rather than at a git 128.
      - name: Add plugin dependencies
        if: ${{ inputs.plugin-dependencies != '' }}
        env:
          PLUGIN_DEPENDENCIES: ${{ inputs.plugin-dependencies }}
          DEPENDENCIES_TOKEN: ${{ secrets.PLUGIN_DEPENDENCIES_TOKEN }}
        run: |
          if [ -n "$DEPENDENCIES_TOKEN" ]; then
            echo "::add-mask::$DEPENDENCIES_TOKEN"
          fi
          # Process plugin dependencies line by line, skipping empty lines
          printf '%s\n' "$PLUGIN_DEPENDENCIES" | while IFS=',' read -r repo branch; do
            # Skip empty lines
            if [ -n "$repo" ] && [ -n "$branch" ]; then
              echo "Adding plugin dependency: $repo (branch: $branch)"
              if GIT_TERMINAL_PROMPT=0 git ls-remote "https://github.com/$repo.git" HEAD > /dev/null 2>&1; then
                moodle-plugin-ci add-plugin --branch "$branch" "$repo"
              elif [ -n "$DEPENDENCIES_TOKEN" ]; then
                echo "$repo is not publicly readable, cloning it with the PLUGIN_DEPENDENCIES_TOKEN secret."
                GIT_TERMINAL_PROMPT=0 \
                  GIT_CONFIG_COUNT=1 \
                  GIT_CONFIG_KEY_0="url.https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/${repo}.insteadOf" \
                  GIT_CONFIG_VALUE_0="https://github.com/${repo}" \
                  moodle-plugin-ci add-plugin --branch "$branch" "$repo"
              else
                echo "::error::The plugin dependency $repo is not publicly readable and no PLUGIN_DEPENDENCIES_TOKEN secret reached this workflow. Map it in the secrets block of the calling ci.yml job; pull requests from forks and from Dependabot never receive secrets."
                exit 1
              fi
            fi
          done

      - name: Run pre-install script
        if: ${{ inputs.pre-install-script != '' }}
        run: ${{ inputs.pre-install-script }}

      # Tag the plugin's Behat feature files with @behat_slice_<n> so that each parallel slice
      # job can run its own subset later. This must happen before the install step because
      # moodle-plugin-ci mirrors (copies) the plugin into the Moodle tree during install.
      - name: Distribute Behat features into slices
        if: ${{ inputs.behat-slices > 1 }}
        run: |
          SLICES=${{ inputs.behat-slices }}
          echo "Distributing Behat feature files across $SLICES slices (greedy, weighted by scenario count)..."

          # Initialise per-slice scenario load counters.
          declare -a load
          for ((s = 0; s < SLICES; s++)); do
            load[$s]=0
          done

          # Collect the plugin's feature files with their scenario counts, heaviest first
          # (deterministic tie-break by path so every slice job computes the same assignment).
          mapfile -t entries < <(
            find plugin -path '*/tests/behat/*.feature' -type f -print0 |
              while IFS= read -r -d '' f; do
                c=$(grep -cE '^[[:space:]]*(Scenario:|Scenario Outline:)' "$f" || true)
                printf '%s\t%s\n' "$c" "$f"
              done | sort -t"$(printf '\t')" -k1,1nr -k2,2
          )

          if [ ${#entries[@]} -eq 0 ]; then
            echo "No Behat feature files found to distribute, nothing to do."
            exit 0
          fi

          # Greedy bin-packing: assign each feature file to the currently least-loaded slice.
          for entry in "${entries[@]}"; do
            count=${entry%%$'\t'*}
            file=${entry#*$'\t'}

            min=0
            for ((s = 1; s < SLICES; s++)); do
              if [ "${load[$s]}" -lt "${load[$min]}" ]; then
                min=$s
              fi
            done

            # Append the slice tag to line 1, which is a tag line by Moodle feature file convention.
            sed -i "1 s/\$/ @behat_slice_${min}/" "$file"
            load[$min]=$(( load[$min] + count ))
            echo "  slice ${min}  (+${count} scenarios)  ${file}"
          done

          echo "Resulting scenario load per slice:"
          for ((s = 0; s < SLICES; s++)); do
            echo "  slice ${s}: ${load[$s]} scenarios"
          done

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-core-branch }}

      - name: Add extra config
        if: ${{ !cancelled() && inputs.extra-config != '' }}
        env:
          EXTRA_CONFIG: ${{ inputs.extra-config }}
        run: |
          # Process the extra config lines one by one, skipping empty lines.
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "Adding config line: $line"
              moodle-plugin-ci add-config "$line"
            fi
          done <<< "$EXTRA_CONFIG"

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Raise Behat timeout
        if: ${{ !cancelled() && inputs.behat-timeout != '' }}
        run: moodle-plugin-ci add-config '$CFG->behat_increasetimeout = ${{ inputs.behat-timeout }};'

      # Combine the configured Behat tags (if any) with this job's slice tag (if slicing is active)
      # and expose the result as BEHAT_TAGS for the Behat step. The slice tag is ANDed into every
      # comma-separated OR-group so that "(@a,@b)" becomes "@a&&@slice,@b&&@slice".
      - name: Compose Behat tags
        if: ${{ !cancelled() }}
        run: |
          TAGS='${{ inputs.behat-tags }}'
          SLICE='${{ matrix.behat-slice }}'
          if [ -n "$SLICE" ]; then
            if [ -n "$TAGS" ]; then
              composed=''
              IFS=',' read -ra groups <<< "$TAGS"
              for g in "${groups[@]}"; do
                [ -n "$composed" ] && composed="$composed,"
                composed="${composed}${g}&&@behat_slice_${SLICE}"
              done
              TAGS="$composed"
            else
              TAGS="@behat_slice_${SLICE}"
            fi
          fi
          echo "BEHAT_TAGS=$TAGS" >> "$GITHUB_ENV"
          echo "Using Behat tags: ${TAGS:-(none, moodle-plugin-ci default component tag applies)}"

      # moodle-plugin-ci would start Selenium and the PHP built-in web server for Behat itself. However, it runs the
      # web server as a single process, discards its output and does not restart it if it dies. If the server crashes
      # in the middle of the run, every remaining scenario fails with "Connection refused", the automatic reruns hit the
      # dead server as well and the whole slice is lost. Therefore the workflow starts both servers on its own:
      # Selenium exactly like moodle-plugin-ci does it, and the PHP web server in a supervisor loop which restarts it
      # immediately if it dies and logs its output and exit codes for later diagnosis.
      - name: Start Selenium and PHP web server for Behat
        if: ${{ !cancelled() }}
        run: |
          MOODLE_DIR="${{ github.workspace }}/moodle"
          WEBSERVER_LOG="${{ runner.temp }}/php-webserver.log"

          # Start Selenium with the same options as moodle-plugin-ci does (host networking, shared memory,
          # Moodle directory mounted at the same path for file uploads in Behat).
          docker run -d --rm --name=selenium --network=host --shm-size=2g \
            -v "$MOODLE_DIR:$MOODLE_DIR" \
            "${MOODLE_BEHAT_SELENIUM_IMAGE:-${{ runner.arch == 'ARM64' && 'selenium/standalone-chromium:4' || 'selenium/standalone-chrome:4' }}}"

          # Moodle 5.1+ serves the site from the public subdirectory.
          DOCROOT="$MOODLE_DIR"
          if [ -f "$DOCROOT/public/version.php" ]; then
            DOCROOT="$DOCROOT/public"
          fi

          # Supervisor loop: run the PHP built-in web server and start it again if it exits for whatever reason.
          # The server's request log and its exit codes (e.g. 139 for a segmentation fault or 137 for an OOM kill)
          # go to the web server log file which is uploaded as an artifact if the Behat run fails.
          # A plain Bash loop is used instead of a systemd transient unit (systemd-run with Restart=always) because it
          # needs no sudo, runs as the runner user with the PHP from setup-php, writes its log to a plain file and
          # can be tested locally.
          cat > "${{ runner.temp }}/php-webserver-supervisor.sh" <<'EOF'
          #!/bin/bash
          DOCROOT="$1"
          while true; do
            php -S localhost:8000 -t "$DOCROOT"
            STATUS=$?
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') ::: php -S exited with status $STATUS, restarting it"
            sleep 1
          done
          EOF
          nohup bash "${{ runner.temp }}/php-webserver-supervisor.sh" "$DOCROOT" > "$WEBSERVER_LOG" 2>&1 &

          # Wait until both servers accept connections.
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4444/status && curl -s -o /dev/null http://localhost:8000/; then
              break
            fi
            sleep 1
          done
          curl -s http://localhost:4444/status | grep -q '"ready": *true' || { echo "::error::Selenium did not become ready"; exit 1; }
          curl -s -o /dev/null http://localhost:8000/ || { echo "::error::PHP web server did not become ready"; exit 1; }
          echo "Selenium and PHP web server (document root $DOCROOT) are running."

      # The Behat output is additionally written to a log file so that the next step can inspect the Behat summary.
      # pipefail makes sure that the step still fails if moodle-plugin-ci fails, even though its output is piped through tee.
      # MOODLE_START_BEHAT_SERVERS is set to YES by moodle-plugin-ci install and is overridden here because the servers
      # have already been started by the previous step.
      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          export MOODLE_START_BEHAT_SERVERS=NO
          moodle-plugin-ci behat --profile chrome${{ needs.preflight.outputs.scss-deprecations == 'true' && ' --scss-deprecations' || '' }}${{ inputs.behat-suite != '' && format(' --suite {0}', inputs.behat-suite) || '' }} ${BEHAT_TAGS:+--tags="$BEHAT_TAGS"} 2>&1 | tee "${{ runner.temp }}/behat-output.log"

      # Report if the PHP web server had to be restarted during the Behat run. This points to a server crash which
      # the supervisor loop has covered, the web server log then holds the details. The number of restarts is
      # exposed as a step output so that the log is uploaded as an artifact in this case even if the Behat run passed.
      - name: Check PHP web server restarts
        id: webserver
        if: ${{ !cancelled() }}
        run: |
          WEBSERVER_LOG="${{ runner.temp }}/php-webserver.log"
          RESTARTS=0
          if [ -f "$WEBSERVER_LOG" ]; then
            RESTARTS=$(grep -c '::: php -S exited with status' "$WEBSERVER_LOG" || true)
          fi
          echo "restarts=$RESTARTS" >> "$GITHUB_OUTPUT"
          if [ "$RESTARTS" -gt 0 ]; then
            echo "::warning::The PHP web server exited $RESTARTS time(s) during the Behat run and was restarted by the supervisor loop. Scenarios which failed because of this should have passed in the automatic rerun. See the PHP web server log for the exit codes and the last requests before each exit."
            grep -B5 '::: php -S exited with status' "$WEBSERVER_LOG"
          else
            echo "The PHP web server ran without interruption."
          fi

      - name: Stop Selenium and PHP web server
        if: ${{ always() }}
        run: |
          pkill -f php-webserver-supervisor.sh || true
          pkill -f 'php -S localhost:8000' || true
          docker stop selenium || true

      # moodle-plugin-ci reruns failed scenarios automatically. If a scenario fails in the first attempt and passes in
      # the rerun, the Behat step is green and the job log only holds the generic Behat error message with a truncated
      # HTML snippet. This step detects such reruns from the Behat output, prints a warning with the failed steps of the
      # first attempt and exposes the number of reruns as a step output so that the Behat faildump (screenshots and HTML
      # of the failed steps, which Moodle has written to the dump directory during the first attempt) is uploaded as an
      # artifact even though the job passed. This makes flaky scenarios diagnosable.
      - name: Check for Behat reruns
        id: behatrerun
        if: ${{ !cancelled() }}
        run: |
          BEHAT_LOG="${{ runner.temp }}/behat-output.log"
          RERUNS=0
          if [ -f "$BEHAT_LOG" ]; then
            # Moodle's Behat runner prints "*** Re-running behat run: <name> ***" before each automatic rerun.
            RERUNS=$(grep -c '^\*\*\* Re-running behat run:' "$BEHAT_LOG" || true)
          fi
          echo "reruns=$RERUNS" >> "$GITHUB_OUTPUT"
          if [ "$RERUNS" -gt 0 ]; then
            if [ "${{ steps.behat.outcome }}" = "success" ]; then
              echo "::warning::Behat scenarios failed in the first attempt and only passed in the automatic rerun ($RERUNS rerun(s)). These scenarios are flaky and should be investigated. The Behat faildump with the screenshots and the HTML of the failed steps from the first attempt is uploaded as an artifact."
            else
              echo "Behat scenarios failed in the first attempt and were rerun $RERUNS time(s)."
            fi
            echo "Failed steps of the first attempt:"
            echo ""
            # Print the "Failed steps" block of the first attempt, which ends with the summary lines of that attempt.
            awk '/^--- Failed steps:/ { p = 1 } /^[0-9]+ scenarios? \(/ { p = 0 } /^\*\*\* Re-running behat run:/ { exit } p' "$BEHAT_LOG"
          else
            echo "Behat did not have to rerun any scenarios."
          fi

      # Behat does not treat pending steps (e.g. a 'the following "x" exist' step with an entity which the plugin's
      # Behat generator does not know) or undefined steps (a step without a matching step definition) as failures
      # and exits with code 0. The affected scenarios are silently skipped and the Behat step passes nevertheless.
      # To catch such glitches, this step scans the Behat summary lines for pending or undefined steps and fails if any are found.
      # The check can be disabled with the behat-strict input or the MOODLE_PLUGIN_CI_BEHAT_STRICT configuration variable.
      - name: Check for pending or undefined Behat steps
        if: ${{ !cancelled() && steps.behat.outcome == 'success' && needs.preflight.outputs.behat-strict == 'true' }}
        run: |
          BEHAT_LOG="${{ runner.temp }}/behat-output.log"
          if [ ! -f "$BEHAT_LOG" ]; then
            echo "No Behat output found, nothing to check."
            exit 0
          fi

          # Behat prints summary lines like "12 scenarios (11 passed, 1 pending)" and
          # "130 steps (120 passed, 1 pending, 9 skipped)" and only lists the result types which actually occurred.
          if grep -qE '^[0-9]+ (scenarios?|steps?) \(.*(pending|undefined)' "$BEHAT_LOG"; then
            echo "Behat reported pending or undefined steps:"
            echo ""
            # Print the list of pending steps (if Behat printed one) and the summary lines.
            awk '/^--- Pending steps:/ { p = 1 } /^[0-9]+ scenarios? \(/ { p = 0 } p' "$BEHAT_LOG"
            grep -E '^[0-9]+ (scenarios?|steps?) \(' "$BEHAT_LOG"
            echo ""
            echo "::error::Behat reported pending or undefined steps. Pending steps are typically caused by a Behat generator entity which does not exist in this plugin version, undefined steps by a missing step definition. Please check the Behat output above and fix the affected scenarios."
            exit 1
          fi

          echo "No pending or undefined Behat steps found."

      - name: Upload Behat Faildump
        if: ${{ !cancelled() && (steps.behat.outcome == 'failure' || steps.behatrerun.outputs.reruns > 0) }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      # The PHP web server log is uploaded if the Behat run failed or if the web server had to be restarted,
      # because in the latter case the log holds the details of the crash even though the job may have passed.
      - name: Upload PHP web server log
        if: ${{ !cancelled() && (steps.behat.outcome == 'failure' || steps.webserver.outputs.restarts > 0) }}
        uses: actions/upload-artifact@v7
        with:
          name: PHP web server log (${{ join(matrix.*, ', ') }})
          path: ${{ runner.temp }}/php-webserver.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

  verify:
    name: Runtime verification
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    needs: [preflight, run]
    env:
      GENERIC_USERNAME_1: ${{ secrets.GENERIC_USERNAME_1 }}
      GENERIC_PASSWORD_1: ${{ secrets.GENERIC_PASSWORD_1 }}
      GENERIC_USERNAME_2: ${{ secrets.GENERIC_USERNAME_2 }}
      GENERIC_PASSWORD_2: ${{ secrets.GENERIC_PASSWORD_2 }}

    services:
      # Only start the database service which the matrix entry needs, an empty image skips the service.
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

      redis:
        image: ${{ inputs.redis-enabled && 'redis:latest' || '' }}
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: true
      max-parallel: ${{ inputs.max-parallel-verify || 999 }}
      matrix: ${{ fromJson(needs.preflight.outputs.matrix-verify) }}

    steps: *runtime-steps
